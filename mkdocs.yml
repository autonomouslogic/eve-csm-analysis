site_name: EVE CSM Analysis

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - CSM 20: csm20.md
  - CSM 19: csm19.md
  - CSM 18: csm18.md
  - CSM 17: csm17.md
  - CSM 16: csm16.md
  - CSM 15: csm15.md
  - CSM 14: csm14.md
  - CSM 13: csm13.md
  - CSM 12: csm12.md
  - CSM 11: csm11.md
  - CSM 10: csm10.md
  - CSM 9: csm9.md
  - CSM 8: csm8.md
  - Alumni: alumni.md
  - Glossary: glossary.md

plugins:
  - charts
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/vega@5
  - https://cdn.jsdelivr.net/npm/vega-lite@5
  - https://cdn.jsdelivr.net/npm/vega-embed@6

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: vegalite
          class: vegalite
          format: !!python/name:mkdocs_charts_plugin.fences.fence_vegalite
